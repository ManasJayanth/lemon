name: Nightly release
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
concurrency:
  group: nightly
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/esy-cache
      - id: v
        # Nightly version: next minor of the base version, then the date as
        # the fourth, numeric part (valid for winget's PackageVersion too).
        # Example: base 0.2.0, date 2026-10-13 -> 0.3.20261013
        run: |
          BASE=$(python3 -c 'import json; print(json.load(open("esy.json"))["version"])')
          NIGHTLY=$(python3 -c "
          base = '$BASE'.split('.')
          date = __import__('datetime').date.today().strftime('%Y%m%d')
          print(f'{base[0]}.{int(base[1]) + 1}.{date}')")
          echo "version=$NIGHTLY" >> "$GITHUB_OUTPUT"
          echo "nightly version: $NIGHTLY (base $BASE)"
  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, platform: macos, arch: arm64 }
          - { os: macos-15-intel, platform: macos, arch: x86_64 }
          - { os: ubuntu-latest, platform: linux, arch: x86_64 }
          - { os: windows-latest, platform: windows, arch: x86_64 }
    runs-on: ${{ matrix.os }}
    env:
      LEMON_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/esy-cache
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install -g esy@0.9.2
      - name: Provide awk for melange's build rules (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # esy's build sandbox strips the outer PATH and its bundled cygwin
          # ships no awk; melange's rules need one. Copy Git's gawk and its
          # msys runtime DLLs into esy-bash's cygwin bin so dune finds them.
          $gitusr = "C:\Program Files\Git\usr\bin"
          $esybash = Join-Path (npm root -g) "esy\node_modules\@prometheansacrifice\esy-bash\.cygwin\bin"
          if (-not (Test-Path $esybash)) {
            $bash = Get-ChildItem -Path (npm root -g) -Recurse -Filter bash.exe
              | Where-Object { $_.FullName -like "*esy-bash*" } | Select-Object -First 1
            if ($bash) { $esybash = $bash.DirectoryName }
          }
          Write-Host "esy-bash bin: $esybash"
          if (Test-Path $esybash) {
            Copy-Item "$gitusr\awk.exe" $esybash -Force
            Copy-Item "$gitusr\gawk.exe" $esybash -Force -ErrorAction SilentlyContinue
            Copy-Item "$gitusr\msys-*.dll" $esybash -Force
            & "$esybash\bash.exe" -c "awk --version | head -1"
          } else {
            Write-Host "esy-bash cygwin bin not found; awk not provisioned"
          }
      - run: esy
      - run: esy sh packaging/make-dist.sh
        shell: bash
      - name: Smoke-test the distribution
        run: esy sh packaging/smoke-dist.sh dist/staging/lemon-*
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/lemon-*
  source:
    needs: version
    runs-on: ubuntu-latest
    env:
      LEMON_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ./.github/actions/esy-cache
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 packaging/make-src-dist.py "$(pwd)" dist
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-source
          path: dist/lemon-source-*
  release:
    needs: [version, build, source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/esy-cache
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          find . -name 'lemon-*' -type f | sort | xargs sha256sum > SHA256SUMS
      - name: Replace the rolling nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly \
            --prerelease \
            --title "Lemon nightly $VERSION" \
            --notes "Automated nightly build of \`$(git rev-parse --short HEAD)\`.

          Version $VERSION (base $(python3 -c 'import json; print(json.load(open("esy.json"))["version"])')).

          - Dist archives for macOS (arm64/x86_64), Linux, and Windows
          - Source tarball with pinned submodules
          - SHA256SUMS

          Not submitted to winget or the Homebrew tap; install by unpacking
          or via the winget manifest rendered from this release
          (packaging/winget/README.md)." \
            artifacts/*
  winget:
    # Keep the winget package continuously verified: render its manifest
    # against this nightly release and install through winget from the
    # published URL.
    needs: [version, release]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/esy-cache
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Render and install the manifest
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/nightly/lemon-$env:VERSION-windows-x86_64.zip"
          $zip = "$env:RUNNER_TEMP\lemon.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          python packaging/winget/render-manifest.py "$env:RUNNER_TEMP\winget" $env:VERSION $url $zip
          winget validate --manifest "$env:RUNNER_TEMP\winget"
          winget install --manifest "$env:RUNNER_TEMP\winget" --exact --silent `
            --accept-source-agreements --accept-package-agreements
      - name: Smoke-test the winget-installed lemon
        shell: pwsh
        run: |
          $lemon = "$env:LOCALAPPDATA\Microsoft\WinGet\Links\lemon.exe"
          $tmp = "$env:RUNNER_TEMP\winget-smoke"
          New-Item -ItemType Directory -Force $tmp | Out-Null
          Set-Content "$tmp\hello.re" 'print_endline("nightly winget lemon");'
          & $lemon build --target js --react --out-dir "$tmp\js-out" "$tmp\hello.re"
          if ((node "$tmp\js-out\Hello.js") -notmatch "nightly winget lemon") { exit 1 }
