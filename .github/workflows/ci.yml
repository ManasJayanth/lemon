name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install esy
        run: npm install -g esy@0.9.2
      - name: Provide awk for melange's build rules (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # esy's build sandbox strips the outer PATH and its bundled cygwin
          # ships no awk; melange's rules need one. Copy Git's gawk and its
          # msys runtime DLLs into esy-bash's cygwin bin so dune finds them.
          $gitusr = "C:\Program Files\Git\usr\bin"
          $esybash = Join-Path (npm root -g) "esy\node_modules\@prometheansacrifice\esy-bash\.cygwin\bin"
          if (-not (Test-Path $esybash)) {
            $bash = Get-ChildItem -Path (npm root -g) -Recurse -Filter bash.exe
              | Where-Object { $_.FullName -like "*esy-bash*" } | Select-Object -First 1
            if ($bash) { $esybash = $bash.DirectoryName }
          }
          Write-Host "esy-bash bin: $esybash"
          if (Test-Path $esybash) {
            Copy-Item "$gitusr\awk.exe" $esybash -Force
            Copy-Item "$gitusr\gawk.exe" $esybash -Force -ErrorAction SilentlyContinue
            Copy-Item "$gitusr\msys-*.dll" $esybash -Force
            & "$esybash\bash.exe" -c "awk --version | head -1"
          } else {
            Write-Host "esy-bash cygwin bin not found; awk not provisioned"
          }
      - name: Install compiler and build Lemon
        run: esy
      - name: Run the full end-to-end catalog
        run: esy python tests/test_build.py --suite all
  gated:
    # E12 (unwritable publication parent) and W10/W11 (strace) run on Linux only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y strace
      - run: npm install -g esy@0.9.2
      - name: Provide awk for melange's build rules (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # esy's build sandbox strips the outer PATH and its bundled cygwin
          # ships no awk; melange's rules need one. Copy Git's gawk and its
          # msys runtime DLLs into esy-bash's cygwin bin so dune finds them.
          $gitusr = "C:\Program Files\Git\usr\bin"
          $esybash = Join-Path (npm root -g) "esy\node_modules\@prometheansacrifice\esy-bash\.cygwin\bin"
          if (-not (Test-Path $esybash)) {
            $bash = Get-ChildItem -Path (npm root -g) -Recurse -Filter bash.exe
              | Where-Object { $_.FullName -like "*esy-bash*" } | Select-Object -First 1
            if ($bash) { $esybash = $bash.DirectoryName }
          }
          Write-Host "esy-bash bin: $esybash"
          if (Test-Path $esybash) {
            Copy-Item "$gitusr\awk.exe" $esybash -Force
            Copy-Item "$gitusr\gawk.exe" $esybash -Force -ErrorAction SilentlyContinue
            Copy-Item "$gitusr\msys-*.dll" $esybash -Force
            & "$esybash\bash.exe" -c "awk --version | head -1"
          } else {
            Write-Host "esy-bash cygwin bin not found; awk not provisioned"
          }
      - run: esy
      - name: Environment-gated scenarios
        run: esy python tests/test_build.py --case E12 --case W10 --case W11
        env:
          LEMON_UNPRIVILEGED: '1'
  browser:
    # B01-B08 exercise the production Vite bundle in a real browser (Linux).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g esy@0.9.2
      - name: Provide awk for melange's build rules (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # esy's bundled cygwin no longer ships awk and melange's runtime
          # rules invoke one; the runner's Git installation provides gawk.
          # Expose it both on PATH and inside esy-bash's cygwin bin (with
          # its DLLs) so dune resolves it either way.
          $gitusr = "C:\Program Files\Git\usr\bin"
          Add-Content $env:GITHUB_PATH $gitusr
          $esyDir = Split-Path (Get-Command esy -ErrorAction SilentlyContinue).Source -ErrorAction SilentlyContinue
          if (-not $esyDir) { $esyDir = (npm root -g) + "\esy" }
          $cyg = Get-ChildItem -Path (npm root -g) -Recurse -Filter "bash.exe" |
            Where-Object { $_.FullName -like "*esy-bash*" } |
            Select-Object -First 1
          if ($cyg) {
            $bin = $cyg.DirectoryName
            Copy-Item "$gitusr\awk.exe" $bin -ErrorAction SilentlyContinue
            Copy-Item "$gitusr\..\..\usr\bin\msys-2.0.dll" $bin -ErrorAction SilentlyContinue
          }
      - run: esy
      - run: npm install -D playwright@1.64 --no-save
      - run: npx playwright install --with-deps chromium
      - name: Browser scenarios
        run: esy python tests/test_build.py --group browser
        env:
          LEMON_BROWSER_TESTS: '1'
  dist:
    # Package a relocatable distribution on every platform and prove it
    # works from a moved copy (homebrew tap + winget package source).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install -g esy@0.9.2
      - name: Provide awk for melange's build rules (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # esy's bundled cygwin no longer ships awk and melange's runtime
          # rules invoke one; the runner's Git installation provides gawk.
          # Expose it both on PATH and inside esy-bash's cygwin bin (with
          # its DLLs) so dune resolves it either way.
          $gitusr = "C:\Program Files\Git\usr\bin"
          Add-Content $env:GITHUB_PATH $gitusr
          $esyDir = Split-Path (Get-Command esy -ErrorAction SilentlyContinue).Source -ErrorAction SilentlyContinue
          if (-not $esyDir) { $esyDir = (npm root -g) + "\esy" }
          $cyg = Get-ChildItem -Path (npm root -g) -Recurse -Filter "bash.exe" |
            Where-Object { $_.FullName -like "*esy-bash*" } |
            Select-Object -First 1
          if ($cyg) {
            $bin = $cyg.DirectoryName
            Copy-Item "$gitusr\awk.exe" $bin -ErrorAction SilentlyContinue
            Copy-Item "$gitusr\..\..\usr\bin\msys-2.0.dll" $bin -ErrorAction SilentlyContinue
          }
      - run: esy
      - name: Build the distribution
        run: esy sh packaging/make-dist.sh
      - name: Smoke-test the distribution (relocated)
        run: esy sh packaging/smoke-dist.sh dist/staging/lemon-*
        shell: bash
      - name: Validate the winget manifest (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VER=$(python3 -c 'import json; print(json.load(open("esy.json"))["version"])')
          python3 packaging/winget/render-manifest.py build/winget "$VER" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VER}/lemon-${VER}-windows-x86_64.zip" \
            "$(ls dist/lemon-*-windows-*.zip)"
          winget validate --manifest build/winget
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}-${{ runner.arch }}
          path: dist/lemon-*
  homebrew:
    # Build the bottle and pour it through a real `brew install` (the
    # default user path: bottles; see packaging/homebrew/README.md).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install -g esy@0.9.2
      - name: Provide awk for melange's build rules (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # esy's bundled cygwin no longer ships awk and melange's runtime
          # rules invoke one; the runner's Git installation provides gawk.
          # Expose it both on PATH and inside esy-bash's cygwin bin (with
          # its DLLs) so dune resolves it either way.
          $gitusr = "C:\Program Files\Git\usr\bin"
          Add-Content $env:GITHUB_PATH $gitusr
          $esyDir = Split-Path (Get-Command esy -ErrorAction SilentlyContinue).Source -ErrorAction SilentlyContinue
          if (-not $esyDir) { $esyDir = (npm root -g) + "\esy" }
          $cyg = Get-ChildItem -Path (npm root -g) -Recurse -Filter "bash.exe" |
            Where-Object { $_.FullName -like "*esy-bash*" } |
            Select-Object -First 1
          if ($cyg) {
            $bin = $cyg.DirectoryName
            Copy-Item "$gitusr\awk.exe" $bin -ErrorAction SilentlyContinue
            Copy-Item "$gitusr\..\..\usr\bin\msys-2.0.dll" $bin -ErrorAction SilentlyContinue
          }
      - run: esy
      - run: esy sh packaging/homebrew/local-test.sh
