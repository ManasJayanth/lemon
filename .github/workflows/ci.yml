name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install esy
        run: npm install -g esy@0.9.2
      - name: Install compiler and build Lemon
        run: esy
      - name: Run the full end-to-end catalog
        run: esy python tests/test_build.py --suite all
  gated:
    # E12 (unwritable publication parent) and W10 (strace) run on Linux only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y strace
      - run: npm install -g esy@0.9.2
      - run: esy
      - name: Environment-gated scenarios
        run: esy python tests/test_build.py --case E12 --case W10
        env:
          LEMON_UNPRIVILEGED: '1'
